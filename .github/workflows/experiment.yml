name: experiment

# Full real-data run on the committed data snapshot in data/: check the data, run the
# placebo test and the experiment, and commit results/ back to the repo.
# (If data/ is empty, it downloads the prices first.)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: test -f data/prices.parquet || python scripts/01_download.py
      - run: python scripts/01b_data_report.py
      - run: python scripts/00_placebo_test.py
      - run: python scripts/02_run_experiment.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Update results from experiment run ${{ github.run_id }}" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main
