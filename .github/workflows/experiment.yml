name: experiment

# Full real-data run: download prices, check them, run the experiment, and commit
# the results/ folder back to the repo. Raw prices stay out of the repo; they are kept
# as a workflow artifact instead.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/01_download.py
      - run: python scripts/01b_data_report.py
      - run: python scripts/00_placebo_test.py
      - run: python scripts/02_run_experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: prices
          path: data/prices.parquet
          retention-days: 30
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Update results from experiment run ${{ github.run_id }}" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main
