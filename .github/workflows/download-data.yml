name: download-data

# Downloads a fresh copy of the prices on a GitHub runner and commits it to data/.
# Run this only to refresh the snapshot; the experiment workflow uses whatever is in data/.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/01_download.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.parquet data/indices.parquet
          git commit -m "Update data snapshot from download run ${{ github.run_id }}" || echo "no changes"
          git pull --rebase origin main
          git push origin HEAD:main
